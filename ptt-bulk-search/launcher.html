<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PTT Bulk Task Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      width: 280px;
      background: #1a3c5e;
      color: #fff;
    }

    /* ── Header ── */
    .hdr {
      padding: 16px 16px 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .hdr h1 { font-size: 14px; font-weight: 700; letter-spacing: .2px }
    .hdr .ver {
      display: inline-block;
      font-size: 10px;
      background: rgba(255,255,255,.15);
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
    }

    /* ── Login state ── */
    #stateLogin { padding: 20px 16px 18px; text-align: center }
    #stateLogin p {
      font-size: 11px;
      opacity: .75;
      margin-bottom: 16px;
      line-height: 1.55;
    }
    #btnGoogleLogin {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      background: #fff;
      color: #3c4043;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: box-shadow .15s;
    }
    #btnGoogleLogin:hover { box-shadow: 0 2px 8px rgba(0,0,0,.3) }
    #btnGoogleLogin svg { flex-shrink: 0 }
    #loginError {
      font-size: 11px;
      color: #f1948a;
      margin-top: 10px;
      line-height: 1.45;
      min-height: 16px;
      white-space: pre-line;
    }

    /* ── Logged-in state ── */
    #stateLoggedIn { display: none; padding: 14px 16px 16px }
    .user-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    #userPic {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3);
      flex-shrink: 0;
    }
    .user-info { overflow: hidden }
    #userName  { display: block; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    #userEmail { display: block; font-size: 10px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

    .btn-open {
      display: block;
      width: 100%;
      padding: 10px;
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background .15s;
    }
    .btn-open:hover { background: #229954 }

    .btn-logout {
      display: block;
      width: 100%;
      padding: 7px;
      background: transparent;
      color: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: .15s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.8) }

    /* ── Loading state ── */
    #stateLoading {
      padding: 28px 16px;
      text-align: center;
      font-size: 12px;
      opacity: .65;
    }
  </style>
</head>
<body>

  <div class="hdr">
    <h1>🔍 PTT Bulk Task Search</h1>
    <span class="ver">v4.0 — Google Login</span>
  </div>

  <!-- Loading -->
  <div id="stateLoading">Loading...</div>

  <!-- Not signed in -->
  <div id="stateLogin" style="display:none">
    <p>Sign in with your Google account<br>to access PTT Bulk Task Search.</p>
    <button id="btnGoogleLogin">
      <!-- Google "G" logo SVG -->
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      Sign in with Google
    </button>
    <div id="loginError"></div>
  </div>

  <!-- Signed in -->
  <div id="stateLoggedIn">
    <div class="user-row">
      <img id="userPic" src="" alt="">
      <div class="user-info">
        <span id="userName"></span>
        <span id="userEmail"></span>
      </div>
    </div>
    <button class="btn-open" id="btnOpen">🔍 Open Search Window</button>
    <button class="btn-logout" id="btnLogout">Sign out</button>
  </div>

  <script src="auth.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
