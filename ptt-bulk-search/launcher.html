<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PTT Bulk Task Search</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      width: 260px;
      padding: 16px;
      background: #1a3c5e;
      color: #fff;
      text-align: center
    }

    h1 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px
    }

    p {
      font-size: 11px;
      opacity: .8;
      margin-bottom: 14px;
      line-height: 1.5
    }

    button {
      width: 100%;
      padding: 10px;
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer
    }

    button:hover {
      background: #229954
    }

    .sub {
      font-size: 10px;
      opacity: .6;
      margin-top: 8px
    }
  </style>
</head>

<body>
  <h1>PTT Bulk Task Search</h1>
  <p>Opens the search window in a separate tab.<br>You can freely use the browser even while searching.</p>
  <button id="openBtn">🔍 Open Search Window</button>
  <div class="sub">v2.2 — Separate Tab Mode</div>
  <script src="launcher.js"></script>
</body>

</html>
