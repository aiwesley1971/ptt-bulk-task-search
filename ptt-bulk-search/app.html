<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PTT Bulk Task Search</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      color: #2c3e50;
      min-height: 100vh
    }

    .hdr {
      background: linear-gradient(135deg, #1a3c5e, #2471a3);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .hdr h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .3px
    }

    .hdr .ver {
      font-size: 11px;
      background: rgba(255, 255, 255, .2);
      padding: 3px 9px;
      border-radius: 12px
    }

    .main {
      max-width: 1100px;
      margin: 20px 24px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      align-items: start
    }

    .panel {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
      padding: 16px
    }

    .panel h2 {
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eee
    }

    .tabs {
      display: flex;
      border: 1.5px solid #2471a3;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px
    }

    .tab {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: #eef3f9;
      color: #555;
      border: none;
      outline: none;
      transition: .15s
    }

    .tab.on {
      background: #2471a3;
      color: #fff;
      pointer-events: none
    }

    .tab:not(.on):hover {
      background: #d5e8f7
    }

    .desc {
      font-size: 11px;
      color: #555;
      margin-bottom: 12px;
      padding: 6px 10px;
      background: #eaf3fb;
      border-left: 3px solid #2471a3;
      border-radius: 0 4px 4px 0;
      line-height: 1.5
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #444
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 8px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      resize: vertical
    }

    textarea:focus {
      outline: none;
      border-color: #2471a3
    }

    .hint {
      font-size: 10px;
      color: #888;
      margin-top: 3px;
      margin-bottom: 10px
    }

    .drow {
      display: flex;
      gap: 8px;
      margin-bottom: 12px
    }

    .dg {
      flex: 1
    }

    .dg label {
      font-size: 11px
    }

    input[type=date] {
      width: 100%;
      padding: 6px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      font-size: 12px
    }

    .brow {
      display: flex;
      gap: 8px;
      margin-bottom: 10px
    }

    .btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .15s
    }

    #btnStart {
      background: #27ae60;
      color: #fff
    }

    #btnStart:hover:not(:disabled) {
      background: #229954
    }

    #btnStart:disabled {
      background: #aaa;
      cursor: not-allowed
    }

    #btnStop {
      background: #e74c3c;
      color: #fff
    }

    #btnStop:hover {
      background: #cb4335
    }

    #btnExport {
      background: #7d3c98;
      color: #fff
    }

    #btnExport:hover:not(:disabled) {
      background: #6c3483
    }

    #btnExport:disabled {
      background: #bbb;
      cursor: not-allowed
    }

    #btnClear {
      flex: 0 0 70px;
      background: #7f8c8d;
      color: #fff
    }

    #btnClear:hover {
      background: #6d7a7b
    }

    .prog {
      margin-bottom: 8px
    }

    .pbar {
      background: #e0e0e0;
      border-radius: 8px;
      height: 8px;
      overflow: hidden
    }

    .pfill {
      background: #27ae60;
      height: 100%;
      width: 0%;
      transition: width .3s;
      border-radius: 8px
    }

    .plbl {
      font-size: 10px;
      color: #777;
      margin-top: 3px;
      display: flex;
      justify-content: space-between
    }

    .banner {
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 12px;
      margin-bottom: 4px;
      line-height: 1.5;
      min-height: 32px
    }

    .ban-info {
      background: #eaf3fb;
      color: #1a6fa8;
      border: 1px solid #bee3f8
    }

    .ban-ok {
      background: #eafaf1;
      color: #1e8449;
      border: 1px solid #b7ebc9
    }

    .ban-warn {
      background: #fef9e7;
      color: #b7770d;
      border: 1px solid #fcefc0
    }

    .ban-err {
      background: #fdedec;
      color: #c0392b;
      border: 1px solid #f9c9c6
    }

    .result-panel {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
      padding: 16px;
      min-height: 200px
    }

    .result-panel h2 {
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .rcnt {
      font-size: 11px;
      font-weight: 400;
      color: #888
    }

    .twrap {
      overflow: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      max-height: calc(100vh - 160px)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      min-width: 700px
    }

    th {
      background: #1a3c5e;
      color: #fff;
      padding: 6px 8px;
      text-align: left;
      position: sticky;
      top: 0;
      white-space: nowrap;
      font-size: 11px
    }

    td {
      padding: 5px 8px;
      border-bottom: 1px solid #eee;
      vertical-align: top
    }

    tr:hover td {
      background: #f5f9ff
    }

    tr:nth-child(even) td {
      background: #fafafa
    }

    tr:nth-child(even):hover td {
      background: #f0f6ff
    }

    .cf {
      color: #1e8449;
      font-weight: 700
    }

    .cn {
      color: #c0392b
    }

    .ce {
      color: #e67e22
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 40px;
      font-size: 13px
    }
  </style>
</head>

<body>
  <div class="hdr">
    <h1>🔍 PTT Bulk Task Search</h1>
    <span class="ver">v2.2</span>
  </div>
  <div class="main">
    <!-- 왼쪽: 설정 패널 -->
    <div class="panel">
      <h2>Search Settings</h2>
      <div class="tabs">
        <button class="tab on" id="tabStatus">📋 Status Search</button>
        <button class="tab" id="tabDetail">🔍 Detail Search</button>
      </div>
      <div class="desc" id="modeDesc"></div>

      <label>Task Keys (Max 100)</label>
      <textarea id="keys" placeholder="Enter PTT ID&#10;Separate by newline or comma"></textarea>
      <div class="hint" id="kcnt">0 items entered</div>

      <div class="brow">
        <button class="btn" id="btnStart">▶ Start Search</button>
        <button class="btn" id="btnStop" style="display:none">■ Stop</button>
      </div>
      <div class="brow">
        <button class="btn" id="btnExport" disabled>↓ Export CSV</button>
        <button class="btn" id="btnClear">🗑 Clear</button>
      </div>

      <div class="prog" id="prog" style="display:none">
        <div class="pbar">
          <div class="pfill" id="pfill"></div>
        </div>
        <div class="plbl"><span id="pkey">-</span><span id="pcnt">0/0</span></div>
      </div>
      <div class="banner ban-info" id="banner">Enter a Task Key and start the search.</div>
    </div>

    <!-- Right: Result panel -->
    <div class="result-panel">
      <h2>
        Search Results
        <span class="rcnt" id="rcnt"></span>
      </h2>
      <div id="twrap">
        <div class="empty" id="emptyMsg">Results will appear here when you start the search.</div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>

</html>
